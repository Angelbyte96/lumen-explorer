# Build and test Lumen on Windows, and keep the .exe as a download.
# Actions tab -> a run of "Windows build" -> Artifacts -> lumen-windows.
name: Windows build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check the .exe carries Lumen's icon
        shell: pwsh
        run: |
          $shell = Add-Type -Name Shell -Namespace Lumen -PassThru -MemberDefinition @'
          [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
          public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          '@
          $icons = $shell::ExtractIconEx("target\release\lumen.exe", -1, $null, $null, 0)
          if ($icons -lt 1) { throw "lumen.exe has no icon resource" }
          "lumen.exe holds $icons icon(s)"
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-windows
          path: target/release/lumen.exe
          if-no-files-found: error
