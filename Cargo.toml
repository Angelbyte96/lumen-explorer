[package]
name = "lumen"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, lightweight, keyboard-first file explorer"
license = "MIT"

[dependencies]
# glow (OpenGL) backend instead of the default wgpu: much smaller binary.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.36", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# On Windows trash needs a COM threading model; apartment-threaded is its default
# and what winit's main thread uses. The feature does nothing elsewhere.
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
notify = "8"
# Only PNG and JPEG decoders, for the preview panel.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# statvfs, for free space on disks in the side panel.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Opens files with their default app. Not on Windows: see fs::ops::open_with_default_app.
[target.'cfg(not(windows))'.dependencies]
open = "5"

# Drive letters, volume names and free space for the side panel; file
# identities for renames; opening files as File Explorer does. The same
# windows-sys eframe already uses: only adds the feature.
[target.'cfg(windows)'.dependencies]
# The shell's right-click menu (COM). The same windows crate `trash` already
# uses: only adds features.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The window handle the shell's menu items are run for.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# GNOME on Wayland leaves the title bar to the app. Without this feature winit
# draws a bare fallback frame (no title, no double-click to maximize); with it,
# an Adwaita-style one. Same winit eframe already uses: only adds the feature.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization across all crates
codegen-units = 1   # better optimization, slower compile
panic = "abort"     # no unwinding machinery
strip = true        # remove debug symbols

# The Menu key (next to the right Ctrl) arrives as Shift+F10: egui-winit 0.36.2
# with one small change, see vendor/egui-winit/LUMEN.md. Redo it on every egui update.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[build-dependencies]
winresource = "0.1.31"
